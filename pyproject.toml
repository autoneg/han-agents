[project]
name = "han-agents"
version = "0.0.2"
description = "Finalist agents from the Human Agent Negotiation (HAN) league of ANAC"
readme = "README.md"
requires-python = "~=3.11"
authors = [
    { name = "Yasser Mohammad", email = "yasserfarouk@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
# Core deps shared by every finalist. Per-team requirements files live
# under src/han_agents/han{year}/team_X/requirements.txt and are merged
# into the optional-dependencies block below by set_han_finalists.py.
dependencies = [
    "negmas>=0.15.7",
    # negmas-llm's central provider/model resolution (resolve_llm_config,
    # used by GunnerAgent/MiAgent/Group8Negotiator so they never hardcode a
    # provider or model) landed on GitHub main 2026-07-23 but has not been
    # cut into a PyPI release yet (0.4.3 predates it) — pin to main until it is.
    "negmas-llm @ git+https://github.com/autoneg/negmas-llm.git",
    # An LLM finalist needs torch at import time. LLM agents also need a
    # reachable Ollama backend at run time (see tests/test_agents2026.py).
    "torch",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
han_agents = ["**/*.json", "**/*.txt", "**/*.md", "**/*.yaml", "**/*.pkl", "**/*.pt", "**/*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
